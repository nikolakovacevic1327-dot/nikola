<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lordnikola — portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a24;--panel:rgba(18,14,52,.88);--fg:#f08fb5;--a2:#8d86e6;--a3:#6fd8f0;--dim:#8f86c9;--line:#3a3480;--txt:#ece4ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:15px/1.65 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 14px 60px}
.win{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 0 50px rgba(141,134,230,.2);backdrop-filter:blur(3px);overflow:hidden}
.bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px}
.bar i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.bar i:nth-child(1){background:var(--fg)}.bar i:nth-child(2){background:var(--a2)}.bar i:nth-child(3){background:var(--a3)}
.bar .sp{margin-left:auto;display:flex;gap:6px}
#term{padding:16px 16px 22px;min-height:70vh;overflow-wrap:anywhere}
.p{color:var(--fg);font-weight:700}
.cmd{color:#fff}
.out{margin:2px 0 14px;color:var(--txt);max-width:68ch}
.out ul{margin:0;padding-left:18px}
.out li::marker{color:var(--a3)}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:text-bottom;background:var(--fg);animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
button{font:inherit;color:var(--fg);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:rgba(240,143,181,.12);border-color:var(--fg)}
:focus-visible{outline:2px solid var(--a3);outline-offset:2px}
.user{font-weight:700;border-color:var(--fg);box-shadow:0 0 14px rgba(240,143,181,.4)}
.hint{color:var(--dim);font-size:13px;margin-left:8px}
a.btn{display:inline-block;color:#15103a;background:var(--fg);padding:8px 14px;border-radius:6px;font-weight:700;text-decoration:none}
a.btn:hover{filter:brightness(1.12)}
#boot{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .6s}
#boot.off{opacity:0;pointer-events:none}
#bl{width:min(520px,100%);min-height:150px;color:var(--fg);font-size:17px}
#bl .ok{color:var(--a3);font-weight:700;font-size:26px;text-shadow:0 0 18px var(--a3)}
#go{font-size:16px;padding:12px 20px;border-color:var(--fg);box-shadow:0 0 24px rgba(240,143,181,.35);animation:pu 1.6s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 6px rgba(240,143,181,.2)}}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.3}
#boot.flash{animation:fl .7s}
@keyframes fl{0%{background:#3a3480}100%{background:var(--bg)}}
#sk2{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--dim);font-size:13px}
#lg{width:min(340px,92vw);padding:24px 22px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 0 50px rgba(141,134,230,.25);animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.lav{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--fg);box-shadow:0 0 22px rgba(240,143,181,.5);background:center/cover}
.lt{text-align:center;color:#fff;font-weight:700;font-size:18px;margin-bottom:16px}
#lg label{display:block;color:var(--dim);font-size:12px;margin:12px 0 4px}
.fld{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:rgba(0,0,0,.25);color:#fff;letter-spacing:.04em}
.fld.act{border-color:var(--a3);box-shadow:0 0 12px rgba(111,216,240,.35)}
#lb{width:100%;margin-top:20px;padding:10px;background:var(--fg);color:#15103a;font-weight:700;border-color:var(--fg);transition:transform .1s,filter .1s}
#lb.press{transform:scale(.95);filter:brightness(1.35)}
#ls{margin-top:14px;min-height:22px;text-align:center;font-size:14px;color:var(--dim)}
#ls.gr{color:var(--a3);font-weight:700;text-shadow:0 0 14px var(--a3)}
#mouse{position:fixed;left:0;top:0;z-index:40;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
#cta{margin-top:22px;text-align:center}
#cb{font-size:17px;padding:14px 24px;font-weight:700;border-color:var(--fg);box-shadow:0 0 28px rgba(240,143,181,.4);animation:pu 1.8s ease-in-out infinite}
#cb:disabled{animation:none;opacity:.6;cursor:default}
#cw{margin-top:16px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;animation:in .4s}
#code{margin:0;padding:14px;height:230px;overflow:auto;font:inherit;font-size:13px;line-height:1.5;color:var(--a3);white-space:pre-wrap}
#lim{padding:18px;text-align:center;border-top:1px solid var(--fg);background:rgba(240,143,181,.08);animation:in .4s}
#lim strong{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}
.prompt{display:flex;align-items:center;border-radius:6px}
.prompt:focus-within{background:rgba(141,134,230,.1)}
#ti{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--fg);padding:2px 0}
#ti::placeholder{color:var(--dim);opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{font-size:13px;padding:3px 9px;color:var(--a2)}
dialog{border:1px solid var(--fg);border-radius:12px;padding:0;width:min(360px,92vw);background:#120e34;color:var(--txt);font:inherit;box-shadow:0 0 60px rgba(240,143,181,.35);overflow:visible}
dialog::backdrop{background:rgba(6,4,24,.8)}
.ban{height:84px;border-radius:11px 11px 0 0;background:#3a3480 center/cover}
.dc{padding:0 18px 18px;position:relative}
.av{width:80px;height:80px;margin-top:-40px;border-radius:50%;border:4px solid #120e34;background:#3a3480 center/cover;position:relative}
.dc h2{margin:10px 0 0;font-size:20px;color:#fff}
.dc .u{color:var(--dim)}
.box{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(141,134,230,.08);font-size:13px}
.box b{display:block;color:var(--fg);font-size:12px;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.x{position:absolute;right:12px;top:-70px;background:rgba(0,0,0,.55)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#15103a;padding:8px 14px;border-radius:6px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="boot"><div id="bl"></div><button id="go" type="button">[ CLICK TO INITIALIZE ]</button>
  <div id="lg" hidden><div class="lav" id="lav"></div><div class="lt">Secure login</div>
    <label>Username</label><div class="fld" id="lu"></div><label>Password</label><div class="fld" id="lp"></div>
    <button type="button" id="lb" tabindex="-1">Login</button><div id="ls" role="status"></div></div>
  <button id="sk2" type="button" hidden>Skip intro</button></div>
<svg id="mouse" width="24" height="24" viewBox="0 0 24 24" hidden aria-hidden="true"><path d="M3 2v18l5-4.5 3.5 7.5 3-1.4-3.4-7.3H19z" fill="#fff" stroke="#15103a" stroke-width="1.5" stroke-linejoin="round"/></svg>
<main>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i><span>nikola@portfolio: ~</span>
      <span class="sp"><button id="mute" type="button" aria-label="Toggle sound">Sound: on</button><button id="skip" type="button">Skip typing</button></span></div>
    <div id="term" aria-live="polite"></div>
  </div>
<section id="cta" hidden>
    <button id="cb" type="button">Create a website for me!</button>
    <div id="cw" hidden>
      <div class="bar"><i></i><i></i><i></i><span>site.html — generating</span></div>
      <pre id="code"></pre>
      <div id="lim" hidden><strong>You reached your limit.</strong>DM @lordnikola to get your web!
        <p style="margin:14px 0 0"><a class="btn" id="dm" target="_blank" rel="noopener">DM @lordnikola</a> <button type="button" data-dc>View profile</button></p></div>
    </div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dn">
  <div class="ban" id="ban"></div>
  <div class="dc">
    <button class="x" type="button" id="close" aria-label="Close">✕</button>
    <div class="av" id="av"></div>
    <h2 id="dn"></h2>
    <div class="u" id="du"></div>
    <div class="box"><b>About me</b><span id="db"></span></div>
    <div class="box row"><div><b>Discord ID</b><span id="did"></span></div><button type="button" id="copy">Copy</button></div>
    <p style="margin:16px 0 0"><a class="btn" id="open" target="_blank" rel="noopener">Open on Discord</a></p>
  </div>
</dialog>
<div id="toast" role="status"></div>

/* ---------- Audio (synthesized, no files) ---------- */
let AC,master,bus,muted=false,noise;
function audioInit(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  bus=AC.createBiquadFilter();bus.type='lowpass';bus.frequency.value=1400;bus.connect(master);
  noise=AC.createBuffer(1,AC.sampleRate*.1,AC.sampleRate);
  const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(f,d,type,v,t=0,dest){
  if(!AC||fast)return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g);g.connect(dest||master);o.start(s);o.stop(s+d);
}
const key=()=>{if(!skip)tone(900+Math.random()*500,.03,'square',.025)};
function hat(t){const s=AC.createBufferSource(),g=AC.createGain();s.buffer=noise;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(g);g.connect(master);s.start(t)}
const bass=[55,0,55,0,65.4,0,55,0,73.4,0,65.4,0,49,0,55,0];
const arp=[220,262,330,392,330,262,440,392,196,247,294,392,294,247,330,294];
let step=0,nextT=0;
function music(){
  nextT=AC.currentTime+.1;
  setInterval(()=>{while(nextT<AC.currentTime+.35){
    const s=step,t=nextT-AC.currentTime;
    if(bass[s])tone(bass[s],.26,'sawtooth',.09,t,bus);
    tone(arp[s],.13,'triangle',.05,t,bus);
    if(s%2)hat(nextT);
    nextT+=.15;step=(step+1)%16;
  }},100);
}
$('#mute').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.55;$('#mute').textContent='Sound: '+(muted?'off':'on')};
$('#skip').onclick=()=>{skip=true};

/* ---------- Terminal ---------- */
async function run(cmd,html,fn){
  const line=document.createElement('div');
  line.innerHTML='<span class="p">$ </span><span class="cmd"></span><i class="cur"></i>';
  term.appendChild(line);
  const c=line.querySelector('.cmd'),cur=line.querySelector('.cur');
  await sleep(350);
  for(const ch of cmd){c.textContent+=ch;key();await sleep(30+Math.random()*40)}
  await sleep(250);cur.remove();
  const o=document.createElement('div');o.className='out';o.innerHTML=html;term.appendChild(o);if(fn)await fn(o);
  tone(520,.08,'triangle',.05);await sleep(300);
}
async function main(){
  term.insertAdjacentHTML('beforeend','<div class="out" style="color:var(--a3)">Welcome back, Nikola. Session started.</div>');

function initShell(){
  const pr=document.createElement('div'),ch=document.createElement('div');
  pr.className='prompt';
  pr.innerHTML='<span class="p">$&nbsp;</span><input id="ti" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal command" placeholder="type help">';
  ch.className='chips';
  ch.innerHTML=['help','about','skills','pricing','hire','scan','clear'].map(c=>'<button type="button" data-cmd="'+c+'">'+c+'</button>').join('');
  term.appendChild(pr);term.appendChild(ch);
  const ti=pr.querySelector('#ti'),hist=[];let hi=0,busy=false;
  const add=(html,cls)=>{const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;pr.before(d);return d};
  add('Interactive mode unlocked — type <b>help</b> or tap a command below.','out').style.color='var(--a3)';
  async function exec(raw){
    if(busy)return;
    const c=raw.trim().toLowerCase().replace(/\s+/g,' ');
    add('<span class="p">$ </span><span class="cmd">'+esc(raw)+'</span>');
    if(!c)return;
    hist.push(c);hi=hist.length;
    if(c==='clear'){Array.from(term.children).forEach(n=>{if(n!==pr&&n!==ch)n.remove()});return}
    const o=add('','out');busy=true;
    if(c==='scan'||c==='scan --device')await scanDevice(o);
    else if(c==='discord'){o.textContent='Opening Discord profile...';dlg.showModal()}
    else if(CMDS[c])o.innerHTML=CMDS[c]();
    else o.innerHTML='command not found: <b>'+esc(raw.trim())+'</b>. Type <b>help</b>.';
    busy=false;tone(520,.06,'triangle',.04);
    pr.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
  }
  ti.addEventListener('input',()=>{if(!reduce)tone(900+Math.random()*500,.03,'square',.025)});
  ti.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const v=ti.value;ti.value='';exec(v)}
    else if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);ti.value=hist[hi]}
    else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);ti.value=hist[hi]||''}
    else if(e.key==='Tab'){e.preventDefault();const m=Object.keys(CMDS).concat(['scan','clear','discord']).find(k=>ti.value&&k.startsWith(ti.value.toLowerCase()));if(m)ti.value=m}
  });
  ch.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b)exec(b.dataset.cmd)});
  term.addEventListener('click',e=>{if(!e.target.closest('button,a')&&!getSelection().toString())ti.focus({preventScroll:true})});
  if(matchMedia('(pointer:fine)').matches)ti.focus({preventScroll:true});
}
